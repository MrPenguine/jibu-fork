services:
  # S3-compatible local storage — lets the backend's S3StorageService (via
  # AWS_S3_ENDPOINT) run against something real without needing an actual
  # AWS account for local dev. Use real AWS S3 instead for anything beyond
  # local dev by leaving AWS_S3_ENDPOINT unset.
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    cpus: '2.0'
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - minio_data:/data
    # Verified against the real image: no `mc` binary in quay.io/minio/minio
    # (that's the separate quay.io/minio/mc image, used below for minio-init
    # only) — curl against MinIO's own documented health endpoint instead.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  # One-shot: creates the bucket the backend expects, then exits. The
  # backend has no bucket auto-create logic (HeadBucketCommand is
  # read-only), so this step is required, not optional.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${AWS_S3_BUCKET_NAME:-jibu-local}
      "
    networks:
      - data

volumes:
  minio_data:

networks:
  data:
