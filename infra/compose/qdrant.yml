services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    restart: always
    cpus: '2.0'
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - qdrant_storage:/qdrant/storage
      - ../qdrant/qdrant_config.yaml:/qdrant/config/production.yaml
    # Verified against a real bring-up: qdrant/qdrant has no wget/curl/nc,
    # only bash — so this uses bash's /dev/tcp pseudo-device for a plain TCP
    # reachability check rather than a real HTTP health check.
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

volumes:
  qdrant_storage:

networks:
  data:
