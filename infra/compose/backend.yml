services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    cpus: '2.0'
    env_file:
      - ../../apps/backend/.env
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data
      - app

networks:
  data:
  app:
