services:
  redis:
    image: redis:8.2
    container_name: redis
    restart: always
    cpus: '2.0'
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
      - livekit-network

volumes:
  redis_data:

networks:
  data:
  livekit-network:
