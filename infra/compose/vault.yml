services:
  vault:
    image: hashicorp/vault:1.20
    restart: always
    cpus: '2.0'
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # The vault CLI defaults to https:// regardless of the server's own
      # listen-address scheme — without this, `vault status` (used below)
      # fails with "server gave HTTP response to HTTPS client".
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - '8200:8200'
    cap_add:
      - IPC_LOCK
    # Dev mode: no persistent backend, in-memory storage wiped on restart.
    # For anything beyond local dev, configure a real storage backend and
    # remove dev mode entirely.
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

networks:
  data:
