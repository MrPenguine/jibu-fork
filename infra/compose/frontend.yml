services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_N8N_WEBHOOK_BASE_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_BASE_URL:-http://localhost:5678}
    container_name: frontend
    restart: unless-stopped
    cpus: '2.0'
    env_file:
      - ../../apps/frontend/.env
    environment:
      # Server-side base — resolves in-network, unlike the browser-facing
      # NEXT_PUBLIC_API_URL build arg above.
      - BACKEND_URL=http://backend:4000
      - BACKEND_API_URL=http://backend:4000/api
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

networks:
  app:
