# Each service's full definition lives in its own file under
# infra/compose/ — this keeps a change to one service from touching any
# other service's block, and makes each service reviewable/diffable on its
# own. See docs/local-development.md for the local dev flow.
#
# Docker runs infra only — Postgres/Redis/Qdrant/Vault, the LiveKit media
# server, observability, and optional tools. The 4 app processes (backend,
# frontend, worker, livekit-agent) run via Nx/Poetry directly on the host —
# see docs/local-development.md. infra/compose/{backend,frontend,worker,
# livekit-agent}.yml still exist (and their Dockerfiles are real and, for
# backend, build-tested) for a possible later full-containerization pass,
# but are deliberately not included here.
include:
  # --- Data tier ---
  - infra/compose/postgres.yml
  - infra/compose/redis.yml
  - infra/compose/qdrant.yml
  - infra/compose/vault.yml
  - infra/compose/minio.yml

  # --- Voice infra ---
  - infra/compose/livekit.yml

  # --- Observability ---
  - infra/compose/prometheus.yml
  - infra/compose/grafana.yml
  - infra/compose/node-exporter.yml

  # --- Optional tools ---
  - infra/compose/n8n.yml
  - infra/compose/ollama.yml
